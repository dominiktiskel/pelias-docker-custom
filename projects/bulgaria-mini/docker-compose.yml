networks:
  pelias_bulgaria_mini:
    driver: bridge
services:
  libpostal:
    image: pelias/libpostal-service
    container_name: bulgaria_mini_libpostal
    user: "${DOCKER_USER}"
    restart: always
    ports: [ "127.0.0.1:35400:4400" ]
    networks: [ "pelias_bulgaria_mini" ]
  schema:
    image: pelias/schema:master
    container_name: bulgaria_mini_schema
    user: "${DOCKER_USER}"
    volumes:
      - "./pelias.json:/code/pelias.json"
    networks: [ "pelias_bulgaria_mini" ]
  api:
    image: tiskel/pelias-api:v3.0.5
    platform: linux/amd64
    container_name: bulgaria_mini_api
    user: "${DOCKER_USER}"
    restart: always
    environment: [ "PORT=4000" ]
    ports: [ "0.0.0.0:35000:4000" ]
    volumes:
      - "./pelias.json:/code/pelias.json"
    networks: [ "pelias_bulgaria_mini" ]
  openstreetmap:
    image: tiskel/openstreetmap:v4.3.1
    platform: linux/amd64
    container_name: bulgaria_mini_openstreetmap
    user: "${DOCKER_USER}"
    environment:
      NODE_MAX_HEAP: "16384"
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"
    networks: [ "pelias_bulgaria_mini" ]
  openaddresses:
    image: pelias/openaddresses:master
    platform: linux/amd64
    container_name: bulgaria_mini_openaddresses
    user: "${DOCKER_USER}"
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"
    networks: [ "pelias_bulgaria_mini" ]
  elasticsearch:
    image: pelias/elasticsearch:7.17.27
    container_name: bulgaria_mini_elasticsearch
    user: "${DOCKER_USER}"
    restart: always
    ports: [ "127.0.0.1:35200:9200", "127.0.0.1:35300:9300" ]
    volumes:
      - "./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro"
      - "${DATA_DIR}/elasticsearch:/usr/share/elasticsearch/data"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add: [ "IPC_LOCK" ]
    security_opt:
      - seccomp=unconfined
    networks: [ "pelias_bulgaria_mini" ]
